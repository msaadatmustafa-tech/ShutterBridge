name: Build and publish ShutterBridge v1.5

# Manual owner-triggered release. No Apple credentials or personal tokens needed.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shutterbridge-release-v1.5.0
  cancel-in-progress: false

jobs:
  windows:
    name: Test and build Windows EXE
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install locked dependencies
        run: python -m pip install -r Windows/requirements-lock.txt
      - name: Validate dependencies
        run: python -m pip check
      - name: Run Windows tests
        run: python -m unittest discover -s Windows -v
      - name: Build unsigned Windows app
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name ShutterBridge-Windows-v1.5 Windows/camera_remote.py
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/ShutterBridge-Windows-v1.5.exe
          if-no-files-found: error

  ios:
    name: Build unsigned iPhone IPA
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Compile and package
        run: bash scripts/build-unsigned-ipa.sh
      - name: Name release download
        run: cp output/iPhoneBLECamera-unsigned.ipa output/ShutterBridge-iPhone-v1.5-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: release-ios
          path: output/ShutterBridge-iPhone-v1.5-unsigned.ipa
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-ios-build-log
          path: output/xcodebuild.log
          if-no-files-found: ignore

  publish:
    name: Publish source, binaries and checksums
    needs: [windows, ios]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Create clean source archive and checksums
        run: |
          git archive --format=zip --prefix=ShutterBridge/ --output=release/ShutterBridge-v1.5.0-source.zip HEAD
          cd release
          sha256sum ShutterBridge-Windows-v1.5.exe ShutterBridge-iPhone-v1.5-unsigned.ipa ShutterBridge-v1.5.0-source.zip > SHA256SUMS.txt
      - name: Publish v1.5.0
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create v1.5.0 \
            --target "$GITHUB_SHA" \
            --title 'ShutterBridge 1.5.0 — Windows + iPhone Camera Remote' \
            --notes-file docs/RELEASE_NOTES_v1.5.0.md \
            --latest \
            release/ShutterBridge-Windows-v1.5.exe \
            release/ShutterBridge-iPhone-v1.5-unsigned.ipa \
            release/ShutterBridge-v1.5.0-source.zip \
            release/SHA256SUMS.txt
